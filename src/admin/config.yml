backend:
  name: git-gateway
  branch: main

media_folder: "src/uploads"
public_folder: "/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio Projects"
    folder: "src/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Project Title", name: "title", widget: "string"}
      - {label: "Client / Role", name: "subtitle", widget: "string"}
      - {label: "Featured Image", name: "image", widget: "image"}
      
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Homepage Intro"
        name: "home_intro"
        file: "src/_data/settings.json"
        fields:
          - {label: "Intro Image", name: "intro_image", widget: "image", required: false}