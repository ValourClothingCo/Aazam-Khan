backend:
  name: git-gateway
  branch: main

media_folder: "src/uploads"
public_folder: "/uploads"

collections:
  - name: "portfolio"
    label: "Portfolio Projects"
    folder: "src/portfolio"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "System Tag (Do Not Edit)", name: "tags", widget: "hidden", default: "portfolio"}
      - {label: "Project Title", name: "title", widget: "string"}
      - {label: "Short Description (For Homepage Card)", name: "subtitle", widget: "text"}
      - label: "Homepage Preview Media (Images/Videos for the card)"
        name: "gallery"
        widget: "list"
        required: false
        field: {label: "Media File", name: "media", widget: "file"}
      - {label: "Full Page Design (Build your custom layout here!)", name: "body", widget: "markdown", required: false}
      
  - name: "settings"
    label: "Site Content & Settings"
    files:
      - label: "Homepage Content & Layout"
        name: "home_intro"
        file: "src/_data/settings.json"
        fields:
          - {label: "Intro Media (Image or Video)", name: "intro_image", widget: "file", required: false}
          - {label: "Main Title / Name", name: "intro_title", widget: "string", default: "Aazam Khan"}
          - {label: "Subtitle / Role", name: "intro_subtitle", widget: "string", default: "Creative Director & Technical Apparel Designer"}
          - {label: "Bio Paragraph 1", name: "bio_1", widget: "text", required: false}
          - {label: "Bio Paragraph 2", name: "bio_2", widget: "text", required: false}
          
          - label: "Contact Form Email (Where messages are sent)"
            name: "contact_email"
            widget: "string"
            default: "support@valour.co.in"

          - label: "Portfolio Section Title"
            name: "portfolio_title"
            widget: "string"
            default: "Creative Archive"

          - label: "Marquee Banner Text (e.g. SHIPPING WORLD WIDE)"
            name: "marquee_text"
            widget: "string"
            default: "SHIPPING WORLD WIDE • STREETWEAR IN MOTION • FACTORY-READY TECH PACKS •"
            required: false

          - label: "Services Offered"
            name: "services"
            widget: "list"
            required: false
            fields:
              - {label: "Service Name", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          - label: "Customer Reviews / Testimonials"
            name: "testimonials"
            widget: "list"
            required: false
            fields:
              - {label: "Customer Name", name: "name", widget: "string"}
              - {label: "Review Text", name: "review", widget: "text"}
              - {label: "Rating (1 to 5 stars)", name: "stars", widget: "number", value_type: "int", min: 1, max: 5, default: 5}
              
          - label: "Experience"
            name: "experience"
            widget: "list"
            required: false
            fields:
              - {label: "Date / Year", name: "date", widget: "string"}
              - {label: "Job Title", name: "title", widget: "string"}
              - {label: "Company / Location", name: "subtitle", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}

          - label: "Education"
            name: "education"
            widget: "list"
            required: false
            fields:
              - {label: "Date / Year (Optional)", name: "date", widget: "string", required: false}
              - {label: "Degree / Course", name: "title", widget: "string"}
              - {label: "Institution", name: "subtitle", widget: "string"}

          - label: "Toolkit & Skills (Comma-separated)"
            name: "skills_string"
            widget: "string"
            default: "Adobe Illustrator, Adobe Photoshop, Blender 3D, Shopify, Meta Ads, Premiere Pro"
            required: false